---
image: docker:latest
services:
  - docker:dind
before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker login -u "$CI_DOCKER_HUB_USER" -p "$CI_DOCKER_HUB_PASSWORD" $CI_DOCKER_HUB_REGISTRY

# Build based on Tags
docker-deploy:
  stage: build
  script:
    - |
      echo "Build Version: ${CI_COMMIT_TAG}"
    - >
      docker build
      --pull
      --label "org.opencontainers.image.title=$CI_PROJECT_TITLE"
      --label "org.opencontainers.image.url=$CI_PROJECT_URL"
      --label "org.opencontainers.image.created=$CI_JOB_STARTED_AT"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.version=$CI_COMMIT_REF_NAME"
      --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
      --tag $CI_REGISTRY_IMAGE:$build_version
      --tag $CI_DOCKER_HUB_IMAGE:$CI_COMMIT_TAG
      --tag $CI_DOCKER_HUB_IMAGE:$build_version
      .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:$build_version"
    - docker push "$CI_DOCKER_HUB_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_DOCKER_HUB_IMAGE:$build_version"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.\d+$/'
      exists:
        - Dockerfile
