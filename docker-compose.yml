version: "3"

services:
  db:
    image: postgres:10.11-alpine
    environment:
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "postgres"

  server:
    build: .
    expose:
      - "8000"
    ports:
      - 8080:8000
    depends_on:
      - db
    volumes:
      - ./src/:/project/
    environment:
      DEBUG: "True"
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres
