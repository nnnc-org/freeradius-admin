version: '3'

services:
  db:
    image: postgres:10.11-alpine
    environment:
      POSTGRES_PASSWORD: 'postgres'
      POSTGRES_USER: 'postgres'
      POSTGRES_DB: 'postgres'

  proxy:
    image: nginx:1.16-alpine
    depends_on:
      - server
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - staticfiles:/static:ro
    ports:
      - 8080:80

  server:
    build: .
    expose:
      - "8000"
    depends_on:
      - db
    volumes:
      - staticfiles:/project/static
      - ./src/:/project/
    environment:
      DEBUG: 'True'

  tasks:
    build: .
    depends_on:
      - db
    volumes:
      - ./src/:/project/
      - staticfiles:/project/static
    environment:
      HUEY: 'True'
      DEBUG: 'True'

  redis:
    image: "redis:6.2-alpine"

volumes:
  staticfiles:
