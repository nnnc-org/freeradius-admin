{% load crispy_forms_tags %}

<form method="post" action="">
  {% csrf_token %}

  <div class="modal-header">
    <h5 class="modal-title">
      {% if form.instance.pk %}Edit Mosyle{% else %}
      Create New Mosyle{% endif %}
    </h5>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  
  <div class="modal-body {% if form.errors %} invalid{% endif %}">
    <div class="{% if form.non_field_errors %}invalid{% endif %} mb-2">
      {% for error in form.non_field_errors %}
        {{ error }}
      {% endfor %}
    </div>
    {{ form | crispy }}
  </div>
  
  <div class="modal-footer">
    {% if form.instance.pk %}
    <div class="mr-auto">
      <button type="button" id="delete"class="btn btn-outline-danger">Delete?</button>
      <button type="button" id="delete-cancel" style="display:none" class="btn btn-default">Cancel</button>
      <button type="button" id="delete-confirm" style="display:none" class="btn btn-danger">Are you sure?</input>
    </div>
    <script>
        $(document).ready(
          function(){
            $("#delete").click(toggle);
            $("#delete-cancel").click(toggle);
          }
        );

        function toggle() {
          $("#delete-cancel").toggle();
          $("#delete-confirm").toggle();
          $("#delete").toggle();
        }
    </script>
    {% endif %}

    <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
    <button type="submit" class="btn btn-primary">
      {% if form.instance.pk %}Edit{% else %}
      Create{% endif %}
    </button>
  </div>
  
  </form>
